# Runs on every push and pull request: blocks false product claims and
# build breakages from reaching main (and so from reaching production).
name: Site checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Claims guard (no false or unverifiable product claims)
        run: node scripts/check-claims.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://opesflux.devsandvisuals.com
          # Keystatic refuses to build without its GitHub app settings. The real
          # values live in Vercel; this build is only a check and never serves
          # the CMS, so placeholders are enough. Not secrets.
          KEYSTATIC_GITHUB_CLIENT_ID: ci-placeholder
          KEYSTATIC_GITHUB_CLIENT_SECRET: ci-placeholder
          KEYSTATIC_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
