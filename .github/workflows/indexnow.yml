# Tells Bing (and through it ChatGPT search and Copilot), Yandex, Seznam and
# Naver about new and changed pages as soon as Vercel has deployed them.
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
  schedule:
    # Every Monday 07:00 UTC: resubmit the whole sitemap.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the Vercel deployment
        if: github.event_name == 'push'
        run: sleep 300

      - name: Submit changed URLs (after a deploy)
        if: github.event_name == 'push'
        run: node scripts/indexnow.mjs --changed-only

      - name: Submit all URLs (weekly)
        if: github.event_name != 'push'
        run: node scripts/indexnow.mjs
